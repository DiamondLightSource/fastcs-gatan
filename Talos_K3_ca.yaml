# Talos K3 over EPICS Channel Access, for examples/dose_fractionation_aioca.py.
# Same camera as Talos_K3.yaml. Also serves REST on this machine only.
#
# Check before running the driver against it:
#   * No SerialEM session is using this plugin port; the plugin serves one
#     client at a time.
#   * The PVs are visible on this host's network, all starting with the
#     controller id below (e.g. TALOS-K3:Acquisition:DoseFracBusy). Change the
#     id if it clashes with an existing IOC.
controllers:
  - id: TALOS-K3
    type: fastcs_gatan.GatanController
    ip: 10.184.8.4               # SerialEMCCD plugin (GatanSocket server)
    port: 48890
transport:
  - rest:
      host: localhost
      port: 8080
  - epicsca: {}
