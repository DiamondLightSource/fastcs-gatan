on:
  workflow_call:

jobs:
  upload:
    # PyPI publishing disabled until the project is ready; remove this line to re-enable
    if: false
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
